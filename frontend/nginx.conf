# Site public + redirection vers le backend (API, fichiers envoyés, tableau de bord).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 60m;   # envois de la médiathèque (50 Mo par fichier)
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location ~ ^/(api|uploads|admin)(/|$) {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fichiers compilés (noms avec empreinte) : cache long.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Application monopage : toutes les autres routes renvoient index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
